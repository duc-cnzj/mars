name: build_docker

on:
  push:
    tags:
      - "v*"

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      - name: Set output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - uses: paulhatch/semantic-version@v5.0.2
        id: get_version
        with:
          tag_prefix: "v"
      -
        uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          install: true
      -
        name: Login registries
        run: |
          docker login registry.cn-hangzhou.aliyuncs.com -u ${{ secrets.ALIYUN_DOCKER_USERNAME }} --password ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
          docker login -u ${{ secrets.DOCKER_USERNAME }} --password ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          # tag 推送时 checkout 是 detached HEAD，容器内 `git rev-parse --abbrev-ref HEAD`
          # 只会拿到字面量 "HEAD"。这里把真实 ref 名喂进去，避免版本接口暴露 "HEAD"。
          build-args: |
            GIT_BRANCH=${{ github.ref_name }}
          # 刻意不配 cache-from/cache-to：GHA 缓存按 ref 作用域隔离，本 workflow 只在
          # tag 推送时触发，每个 tag 都是全新 ref，缓存只写不读、永不命中；而 mode=max
          # 会导出全部中间层（实测约 3.6GB），给每次构建平白加上约 11 分钟
          # （preparing build cache for export 251s + 逐层写出 + 双平台镜像 ~1.4GB×2）。
          # 收益为 0、支出为 11 分钟，故整体去掉。若将来要恢复缓存，必须同时给
          # 默认分支（master）安排一个只做 cache-to 的预热 job，否则永远读不到。
          # 与原先 --provenance=false --sbom=false 等价：不加 attestation，省时间
          provenance: false
          sbom: false
          tags: |
            duccnzj/mars
            duccnzj/mars:${{ env.tag }}
            duccnzj/mars:v${{ steps.get_version.outputs.major }}.${{ steps.get_version.outputs.minor }}
            registry.cn-hangzhou.aliyuncs.com/duc-cnzj/mars:${{ env.tag }}
            registry.cn-hangzhou.aliyuncs.com/duc-cnzj/mars:v${{ steps.get_version.outputs.major }}.${{ steps.get_version.outputs.minor }}
            registry.cn-hangzhou.aliyuncs.com/duc-cnzj/mars
