name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: test
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Setup minio
        run: |
          docker run -d -p 9000:9000 --name minio \
            -e "MINIO_ACCESS_KEY=minioadmin" \
            -e "MINIO_SECRET_KEY=minioadmin" \
            minio/minio server /data
      - name: Setup Nsq
        run: |
          docker run --name nsqlookupd -p 4160:4160 -p 4161:4161 -d nsqio/nsq /nsqlookupd
          docker run --name nsqd -p 4150:4150 -p 4151:4151 -d nsqio/nsq /nsqd
      - name: Run coverage
        env:
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_USERNAME: root
          DB_DATABASE: test
          S3_ENDPOINT: localhost:9000
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NSQ_ADDR: localhost:4150
          NSQ_LOOKUPD_ADDR: localhost:4161
        run: |
          # CI 不构建真实前端（build/ 被 gitignore），但 frontend 包 //go:embed build/* 必须有文件
          # 才能编译，且 SPA 兜底测试断言 index.html 内容含 <!doctype html>。写入最小合法 stub，
          # 而非空 dummy——否则 staticFs.ReadFile("build/index.html") 运行期失败，兜底返回空页。
          mkdir -p frontend/build && printf '%s\n' "<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"UTF-8\"><title>Mars</title></head><body><div id=\"root\"></div></body></html>" > frontend/build/index.html
          make test
      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          files: ./coverage.txt
          flags: unittests
          name: codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true