name: release
on:
  push:
    tags-ignore:
      - 'api/*'

jobs:
  build-frontend:
    name: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            frontend/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - uses: borales/actions-yarn@v4
        with:
          dir: "frontend"
          cmd: install
      - uses: borales/actions-yarn@v4
        with:
          dir: "frontend"
          cmd: build
      - name: upload build files
        uses: actions/upload-artifact@v4
        with:
          name: frontend_dist_files
          path: |
            frontend/build

  build-linux:
    needs: [build-frontend]
    name: Build Go Binary linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend files
        uses: actions/download-artifact@v4
        with:
          name: frontend_dist_files
          path: frontend/build
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: |
          sudo apt update --fix-missing && sudo apt-get install -y gcc-aarch64-linux-gnu
          make build_linux_amd64
          make build_linux_arm64
      # 只压缩 linux 产物：upx 不支持 macOS——打包 Mach-O 会毁掉 Go 链接器写入的 ad-hoc 签名，
      # Apple Silicon 上内核直接 SIGKILL（实测 exit 137，事后重新 codesign 也救不回来），
      # 4.2.4 与 5.2.1 均如此，故 build-darwin job 保持原样。
      # 版本钉住（勿改成浮动的 latest）：release 产物必须可复现，升级需手动验证后改这里。
      # ⚠️ 必须停在 4.2.4，不要升 5.x：5.1.1/5.2.0/5.2.1 压本项目的 CGO=1 Linux 产物时
      #   压缩成功、自带校验却误报（5.2.1=compressed data violation，5.1.x/5.2.0=checksum
      #   error），把 release 假失败挡在最后一步——实测是 5.x 校验器回归而非产物损坏
      #   （被报坏的产物运行输出与未压缩原产物逐字节相同）。4.2.4 压同一产物 -t 直接 OK。
      #   注：Dockerfile 侧仍动态取 latest，未随本次钉版本，两处版本号不再对齐。
      - name: UPX compress linux binaries
        env:
          UPX_VERSION: 4.2.4
        run: |
          curl -fsSL --retry 3 -o /tmp/upx.tar.xz \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
          mkdir -p /tmp/upx && tar -xf /tmp/upx.tar.xz -C /tmp/upx --strip-components=1
          sudo install -m 755 /tmp/upx/upx /usr/local/bin/upx
          upx -V
          # x86_64 的 upx 能直接压 aarch64 的 ELF：格式支持按宿主 OS 判定，与 CPU 架构无关
          ls -lh bin/
          upx -9 --no-progress bin/app-linux-amd64 bin/app-linux-arm64
          # -t 会整份解压校验，确保压缩后的产物不是坏文件
          upx -t bin/app-linux-amd64 bin/app-linux-arm64
          ls -lh bin/
      - name: upload app-linux-amd64
        uses: actions/upload-artifact@v4
        with:
          name: app-linux-amd64
          path: |
            bin/app-linux-amd64
      - name: upload app-linux-arm64
        uses: actions/upload-artifact@v4
        with:
          name: app-linux-arm64
          path: |
            bin/app-linux-arm64

  build-darwin:
    needs: [build-frontend]
    name: Build Go Binary macos amd64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend files
        uses: actions/download-artifact@v4
        with:
          name: frontend_dist_files
          path: frontend/build
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: |
          make build_darwin_arm64
          make build_darwin_amd64
      - name: upload app-darwin-arm64
        uses: actions/upload-artifact@v4
        with:
          name: app-darwin-arm64
          path: |
            bin/app-darwin-arm64
      - name: upload app-darwin-amd64
        uses: actions/upload-artifact@v4
        with:
          name: app-darwin-amd64
          path: |
            bin/app-darwin-amd64

  release:
    needs: [build-darwin, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Download linux arm64 app
      uses: actions/download-artifact@v4
      with:
        name: app-linux-arm64
        path: /tmp
    - name: Download linux amd64 app
      uses: actions/download-artifact@v4
      with:
        name: app-linux-amd64
        path: /tmp
    - name: Download darwin amd64 app
      uses: actions/download-artifact@v4
      with:
        name: app-darwin-amd64
        path: /tmp
    - name: Download darwin arm64 app
      uses: actions/download-artifact@v4
      with:
        name: app-darwin-arm64
        path: /tmp
    - uses: ncipollo/release-action@v1
      with:
        generateReleaseNotes: true
        allowUpdates: true
        artifacts: "/tmp/**/app*"
        token: ${{ secrets.GITHUB_TOKEN }}

  release-sdk:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Set output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - name: tag sdk
        env:
          GITHUB_TOKEN: ${{ secrets.TAG_GITHUB_TOKEN }}
        run: |
          git config --global user.email "1025434218@qq.com"
          git config --global user.name "duc"
          git config --global init.defaultBranch "master"

          git tag api/$tag
          git push origin api/$tag