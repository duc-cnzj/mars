syntax = "proto3";

package project;

import "google/api/field_behavior.proto";
import "google/api/annotations.proto";
import "proto/websocket/websocket.proto";
import "validate/validate.proto";
import "openapi/v3/annotations.proto";
import "proto/types/types.proto";

option go_package = "github.com/duc-cnzj/mars/api/v6/proto/project;project";

message ListRequest {
  optional int32 page      = 1;
  optional int32 page_size = 2;
}
message ListResponse {
  int32                       page      = 1;
  int32                       page_size = 2;
  int32                       count     = 3;
  repeated types.ProjectModel items     = 4;
}


message ShowRequest {
  int32 id = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
}
message ShowResponse {
  types.ProjectModel item = 1;
}

// ShowByNameRequest 按「空间名 + 项目名」查项目详情：Show 要求先知道项目 id，
// 而调用方（自动化/脚本）手上往往只有名字。空间名免前缀（服务端按 ns_prefix 幂等补全）。
message ShowByNameRequest {
  string namespace = 1 [(validate.rules).string.min_bytes = 1, (google.api.field_behavior) = REQUIRED];
  string name      = 2 [(validate.rules).string.min_bytes = 1, (google.api.field_behavior) = REQUIRED];
}

message DeleteRequest {
  int32 id = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
}
message DeleteResponse {}

// RestoreRequest 按「空间名 + 项目名」定位被误删的项目（空间名免前缀，后台按 ns_prefix 幂等补全）。
// 用业务名而非 id：软删记录已从列表消失，排障时手上往往只剩名字。
message RestoreRequest {
  string namespace = 1 [(validate.rules).string.min_bytes = 1, (google.api.field_behavior) = REQUIRED];
  string name      = 2 [(validate.rules).string.min_bytes = 1, (google.api.field_behavior) = REQUIRED];
}
message RestoreResponse {
  types.ProjectModel item = 1;
}

// AdminDeletedListRequest 已删除项目列表（仅超管）：Restore 的配套「选谁恢复」视图，
// 分页/搜索语义与 namespace.AdminDeletedList 对齐。
message AdminDeletedListRequest {
  optional int32 page      = 1;
  optional int32 page_size = 2;
  // 关键词：匹配项目名或所属空间名
  string search = 3;
}
// AdminDeletedListResponse 已删除项目列表：items 直接复用 types.ProjectModel——它自带
// deleted_at（删除时间）、updated_by（最后操作人）与 namespace 边（恢复请求要按空间名定位，
// 行内缺了它就是一条无法恢复的项目）。
//
// 只列「单独删除」的项目（deleted_with_namespace=false）：随空间级联删除的那批由恢复空间
// 连带还原，本列表调 Restore 会被硬拒 400（所属空间已删），列出来只是不可点的死行。
message AdminDeletedListResponse {
  int32 page      = 1;
  int32 page_size = 2;
  int32 count     = 3;
  repeated types.ProjectModel items = 4;
}

message VersionRequest {
  int32 id = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
}
message VersionResponse {
  int32 version = 1;
}

message AllContainersRequest {
  int32 id = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
}
message AllContainersResponse {
  repeated types.StateContainer items = 1;
}

// ContainerFailure 描述部署判定 FAILED 时失败容器的诊断信息（含日志尾部）。
message ContainerFailure {
  string kind      = 1; // 工作负载类型: Deployment/StatefulSet/DaemonSet
  string workload  = 2; // 工作负载名
  string pod       = 3; // 失败 pod 名
  string container = 4; // 失败容器名
  string reason    = 5; // 失败原因: CrashLoopBackOff/ImagePullBackOff/Error/OOMKilled/Evicted
  string message   = 6; // 容器状态 message（容器从未启动无日志时兜底展示）
  string logs      = 7; // 容器日志尾部（CrashLoopBackOff 取上一次崩溃日志）
}

message CheckApplyStatusRequest {
  int32 id = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
}
message CheckApplyStatusResponse {
  // 聚合判定，复用 types.Deploy：StatusDeployed=正常 / StatusFailed=失败 /
  // StatusDeploying=进行中 / StatusUnknown=未知（无工作负载或项目未部署）
  types.Deploy status = 1;
  // 汇总原因（失败/进行中时的人类可读描述）
  string reason = 2;
  // 项目容器明细（含 is_old 新旧标记），前端可复用 AllContainers 的渲染
  repeated types.StateContainer containers = 3;
  // 判定为 FAILED 时的具体失败容器列表
  repeated ContainerFailure failures = 4;
}

// ResourceTreeNode 拓扑资源树节点：kind/status 与前端拓扑渲染器对齐。
// id 稳定唯一：application-{id} / deployment-{name} / replicaset-{name} / pod-{name} /
// service-{name} / ingress-{name} / statefulset-{name} / daemonset-{name}。
// old 标记滚动升级中的旧 ReplicaSet/Pod（旧版本副本），前端可据此弱化或打标签。
message ResourceTreeNode {
  string id   = 1;
  string kind = 2; // Application | Ingress | Service | Deployment | ReplicaSet | Pod | StatefulSet | DaemonSet
  string name = 3;
  string namespace = 4;
  // healthy=健康 / degraded=异常 / progressing=进行中 / unknown=未知
  string status = 5;
  map<string, string> labels = 6;
  bool old = 7;
}

// ResourceTreeEdge 拓扑资源树边：owner=属主引用，selector=标签选择器，route=路由后端。
message ResourceTreeEdge {
  string id     = 1;
  string type   = 2; // owner | selector | route
  string source = 3;
  string target = 4;
}

message ResourceTreeRequest {
  int32 id = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
}
message ResourceTreeResponse {
  // 项目整体部署状态，复用 types.Deploy 枚举
  types.Deploy status = 1;
  repeated ResourceTreeNode nodes = 2;
  repeated ResourceTreeEdge edges = 3;
}

message ApplyResponse {
  websocket.Metadata metadata = 1;
  types.ProjectModel project  = 2;
}
// ApplyRequest same as ProjectInput
message ApplyRequest {
  int32                         namespace_id            = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
  // name 不传就使用 git 默认的 name
  string                        name                    = 2;
  int32                         repo_id                 = 3 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
  string                        git_branch              = 4;
  //  git_commit 不传就用最新的 commit
  string                        git_commit              = 5;
  string                        config                  = 6;
  bool                          atomic                  = 7;
  bool                          websocket_sync          = 8;
  repeated websocket.ExtraValue extra_values            = 9;
  // 部署超时时间
  int32                         install_timeout_seconds = 10 [(validate.rules).int32.gte = 0, (google.api.field_behavior) = REQUIRED];
  // 发送百分比
  bool                          send_percent            = 11;
  // 版本号, 创建时可以不传
  optional int32                version                 = 12 [(validate.rules).int32.gte = 0, (google.api.field_behavior) = REQUIRED];
}

message  WebApplyRequest {
  int32                         namespace_id = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
  string                        name         = 2;
  int32                         repo_id      = 3 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
  string                        git_branch   = 4;
  //  git_commit 不传就用最新的 commit
  string                        git_commit   = 5;
  string                        config       = 6;
  repeated websocket.ExtraValue extra_values = 7;
  // 版本号, dryRun 时可以不传
  optional int32                version      = 8;
  bool                          dry_run      = 9;
}
// WebApplyByNameRequest 是 WebApply 的「按名字寻址」版本：调用方只提供空间名与 name，
// 无需先查明 namespace_id。仓库默认按 name 精确匹配（见下），也可用 repo_id 显式指定。
//
// 不传 repo_id 时，name 同时充当**项目名**与**仓库名**——服务端据此精确匹配已配置的仓库
// （repo.name 全局唯一，ns_prefix 不作用于仓库名），匹配不到直接报错。由此定下该调用方式的
// 契约：**同一空间下一个仓库只能对应一个项目**（项目名 == 仓库名），不支持「同一个仓库在同一
// 空间部署多个不同名称的项目」。
//
// 传了 repo_id 时以它为准（不再要求 name 命中某个仓库名），此时 name 只是项目名——想在同一
// 空间用同一个仓库部署多个不同名称的项目，就显式传 repo_id。旧的 WebApply 不受本约束影响。
message  WebApplyByNameRequest {
  // namespace 是空间名（免 ns_prefix 前缀，服务端幂等补全）。
  string                        namespace    = 1 [(validate.rules).string.min_bytes = 1, (google.api.field_behavior) = REQUIRED];
  // name 是项目名；不传 repo_id 时它还用于精确匹配仓库名。
  string                        name         = 2 [(validate.rules).string.min_bytes = 1, (google.api.field_behavior) = REQUIRED];
  // repo_id 是可选的仓库显式指定：不传（或传 0）→ 用 name 精确匹配到的仓库，匹配不到报 404；
  // 传了 → 直接用该仓库，name 仅作项目名（不再要求命中仓库名）。仓库不存在同样报 404。
  //
  // 注意：项目一旦创建，其 repo_id 不再变更（更新路径不写该字段）。因此同名项目已存在且
  // 其绑定仓库与本次解析出的仓库不一致时，一律 400 拒绝，避免「按新仓库渲染、DB 仍记旧仓库」
  // 的静默漂移——要换仓库请先删除项目。
  optional int32                repo_id      = 9 [(validate.rules).int32.gte = 0];
  string                        git_branch   = 3;
  //  git_commit 不传就用最新的 commit
  string                        git_commit   = 4;
  string                        config       = 5;
  repeated websocket.ExtraValue extra_values = 6;
  // 版本号：创建不传，更新必传（乐观锁，语义同 WebApply）
  optional int32                version      = 7;
  bool                          dry_run      = 8;
}
message  WebApplyResponse {
  repeated string    yaml_files = 1;
  types.ProjectModel project    = 2;
  bool               dry_run    = 3;
}

message MemoryCpuAndEndpointsRequest {
  int32 id = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
}
message MemoryCpuAndEndpointsResponse {
  repeated types.ServiceEndpoint urls   = 1;
  string                         cpu    = 2;
  string                         memory = 3;
}

// LivenessRequest 项目活跃度查询（管理员后台）。
message LivenessRequest {
  optional int32 page      = 1;
  optional int32 page_size = 2;
  // 关键词：匹配项目名/命名空间名/仓库名
  string search = 3;
  // 活跃度过滤：空 = 全部；active/dormant/zombie = 只看对应活跃度
  string liveness = 4;
  // 排序方向：空 = 按更新时间倒序（desc）；asc/desc = 指定更新时间升/降序
  string sort = 5;
}
// LivenessItem 单个项目的活跃度条目：标识 + 部署状态/次数 + 最近更新。
message LivenessItem {
  int32 id = 1;
  string name = 2;
  string namespace = 3;
  string repo = 4;
  // 最近部署状态：StatusDeployed=正常 / StatusDeploying=进行中 / StatusFailed=失败
  types.Deploy deploy_status = 5;
  // 累计部署次数（changelog 计数）
  int32 deploy_count = 6;
  string git_branch = 7;
  string git_commit = 8;
  // 最近更新时间 RFC3339（活跃度分类依据）
  string updated_at = 9;
  // 最近一次人为更新的用户名（创建/成功部署），系统状态变更不刷新
  string updated_by = 13;
  // 最近提交信息（判断代码是否仍有人维护）：提交标题 / 作者 / 时间 RFC3339
  string git_commit_title = 10;
  string git_commit_author = 11;
  string git_commit_date = 12;
}
// LivenessStats 活跃度统计（服务端按 30/90 天阈值计算）。
message LivenessStats {
  int32 total   = 1;
  int32 active  = 2;
  int32 dormant = 3;
  int32 zombie  = 4;
}
message LivenessResponse {
  int32         page      = 1;
  int32         page_size = 2;
  int32         count     = 3;
  LivenessStats stats     = 4;
  repeated LivenessItem items = 5;
}

service Project {
  //  List 获取项目列表
  rpc List(ListRequest) returns (ListResponse) {
    option (google.api.http) = {
      get: "/api/projects"
    };
  }

  // Apply grpc 创建/更新项目
  rpc Apply(ApplyRequest) returns (stream ApplyResponse);

  // WebApply 创建/更新/DryRun 项目
  rpc WebApply(WebApplyRequest) returns (WebApplyResponse) {
    option (google.api.http)      = {
      post: "/api/projects/apply"
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "WebApply 创建/更新/DryRun 项目",
    };
  }

  // WebApplyByName 按「空间名 + 项目名」创建/更新/DryRun 项目：空间用名字替代 namespace_id，
  // 仓库默认由 name 匹配仓库名、也可用 repo_id 显式指定（详见 message 注释）。
  rpc WebApplyByName(WebApplyByNameRequest) returns (WebApplyResponse) {
    option (google.api.http)      = {
      post: "/api/projects/apply_by_name"
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "按空间名+项目名创建/更新/DryRun 项目",
    };
  }

  // Show 项目详情
  rpc Show(ShowRequest) returns (ShowResponse) {
    option (google.api.http)      = {
      get: "/api/projects/{id}"
    };
    option (openapi.v3.operation) = {
      summary: "项目详情",
    };
  }

  // ShowByName 按「空间名 + 项目名」查项目详情
  rpc ShowByName(ShowByNameRequest) returns (ShowResponse) {
    option (google.api.http)      = {
      get: "/api/projects/by_name/{namespace}/{name}"
    };
    option (openapi.v3.operation) = {
      summary: "按空间名+项目名查项目详情",
    };
  }

  rpc MemoryCpuAndEndpoints(MemoryCpuAndEndpointsRequest) returns (MemoryCpuAndEndpointsResponse) {
    option (google.api.http)      = {
      get: "/api/projects/{id}/memory_cpu_and_endpoints"
    };
    option (openapi.v3.operation) = {
      summary: "项目的cpu/memory/endpoints",
    };
  }

  // Version 版本号, 如果不存在则返回 0
  rpc Version(VersionRequest) returns (VersionResponse) {
    option (google.api.http) = {
      get: "/api/projects/{id}/version"
    };
  }

  // Delete 删除项目
  rpc Delete(DeleteRequest) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/api/projects/{id}"
    };
  }

  // Restore 恢复被误删的项目（仅超管）：清除软删标记并把部署状态重置为未知，
  // 项目配置/部署历史保留，但**不重建** helm release（需另行重新部署）。
  rpc Restore(RestoreRequest) returns (RestoreResponse) {
    option (google.api.http) = {
      post: "/api/admin/projects/restore",
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "恢复被删除的项目（管理员）",
    };
  }

  // AdminDeletedList 已删除项目列表（仅超管）：Restore 的配套「选谁恢复」视图，只列
  // 单独删除的项目（随空间级联删除的那批须先恢复空间，见 message 注释）。
  rpc AdminDeletedList(AdminDeletedListRequest) returns (AdminDeletedListResponse) {
    option (google.api.http) = {
      get: "/api/admin/projects/deleted"
    };
    option (openapi.v3.operation) = {
      summary: "已删除项目列表（管理员）",
    };
  }

  // AllContainers 获取项目下的所有 pod
  rpc AllContainers(AllContainersRequest) returns (AllContainersResponse) {
    option (google.api.http) = {
      get: "/api/projects/{id}/containers"
    };
  }

  // CheckApplyStatus 判定项目最近一次部署后新版本容器是否正常运行。
  // 用于非原子部署（WebApply）后判断部署成功/失败/进行中：
  // 通过工作负载实时状态（Deployment/StatefulSet/DaemonSet 的 updated/available replicas）
  // 与最新版本 pod 容器状态聚合判定，避免过渡窗口误报。
  rpc CheckApplyStatus(CheckApplyStatusRequest) returns (CheckApplyStatusResponse) {
    option (google.api.http) = {
      get: "/api/projects/{id}/apply_status"
    };
    option (openapi.v3.operation) = {
      summary: "检查项目部署后的容器运行状态",
    };
  }

  // ResourceTree 返回项目的资源拓扑树，按访问链路分层：
  // Application → Ingress → Service → Deployment/StatefulSet/DaemonSet → ReplicaSet → Pod。
  // Service 无 Ingress 覆盖、workload 无 Service 覆盖时兜底直挂 Application。完整资源列表
  // （区别于 AllContainers 的活跃容器平铺），供拓扑图 Tab 渲染与 pod 事件驱动下的实时刷新。
  rpc ResourceTree(ResourceTreeRequest) returns (ResourceTreeResponse) {
    option (google.api.http) = {
      get: "/api/projects/{id}/resource_tree"
    };
    option (openapi.v3.operation) = {
      summary: "获取项目资源拓扑树",
    };
  }

  // Liveness 项目活跃度清单（管理员后台）：按 30/90 天阈值分类活跃/低活跃/僵尸，
  // 服务端聚合累计部署次数与统计，识别长期无人使用的治理候选项目。
  rpc Liveness(LivenessRequest) returns (LivenessResponse) {
    option (google.api.http)      = {
      get: "/api/admin/projects/liveness"
    };
    option (openapi.v3.operation) = {
      summary: "项目活跃度清单（管理员）",
    };
  }
}