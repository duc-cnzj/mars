syntax = "proto3";

package mars;

import "validate/validate.proto";

option go_package = "github.com/duc-cnzj/mars/api/v6/proto/mars";

message Config {
  // config_file 指定项目下的默认配置文件, 也可以是别的项目的文件，格式为 "pid|branch|filename"
  string           config_file        = 1;
  // config_file_values 全局配置文件，如果没有 ConfigFile 则使用这个
  string           config_file_values = 2;
  string           config_field       = 3;
  bool             is_simple_env      = 4;
  // config_file_type 配置文件类型，php/env/yaml...
  string           config_file_type   = 5;
  // local_chart_path helm charts 目录, 格式为 "pid|branch|path",
  // v5+ 之后不再支持本地目录
  string           local_chart_path   = 6;
  // branches 启用的分支
  repeated string  branches           = 7;
  // values_yaml 和 values.yaml 一样
  string           values_yaml        = 8;

  // elements 自定义字段
  repeated Element elements           = 9;

  // 显示的名称 (helm app name), 不填就使用 git server project name
  // 以字母开头结尾，中间可以有 '_' '-'
  // Deprecated: v5+ 不再使用这个字段
  string           display_name       = 10 [(validate.rules).string = {
    pattern:   "^[A-Za-z]([A-Z-_a-z]*[^_-])*$",
    max_bytes: 64,
    ignore_empty: true,
  }];

  // pipeline_pass_rules 流水线通过规则：配置的 (stage, job) 全部成功后该流水线才判定为通过。
  // 未配置时 PipelineInfo 返回整体流水线状态。
  repeated PipelinePassRule pipeline_pass_rules = 11;

  // group_settings 分区展示配置：分区排序（order 升序）+ 默认折叠（collapsed）。
  // 分区本身由 Element.group 派生，这里只记录分区的展示元数据。
  // 旧配置无此字段 → 无分区配置 → 前端扁平渲染，行为与旧版一致。
  repeated GroupSetting group_settings = 12;
}

// GroupSetting 是分区（group）的展示配置：分区排序与默认折叠。
message GroupSetting {
  string name      = 1 [(validate.rules).string = { min_bytes: 1, max_bytes: 64 }];
  uint32 order     = 2; // 分区排序：升序，越小越靠前
  bool   collapsed = 3; // 默认折叠：进入页面时该分区收起
}

// PipelinePassRule 是流水线通过规则的单条匹配项：命中指定 stage 下名为 job_name 的 job。
message PipelinePassRule {
  string stage_name = 1;
  string job_name   = 2;
}

enum ElementType {
  ElementTypeUnknown      = 0;
  ElementTypeInput        = 1;
  ElementTypeInputNumber  = 2;
  ElementTypeSelect       = 3;
  ElementTypeRadio        = 4;
  ElementTypeSwitch       = 5;
  ElementTypeTextArea     = 6;
  ElementTypeNumberSelect = 7;
  ElementTypeNumberRadio  = 8;
}

message Element {
  string          path             = 1 [(validate.rules).string.min_bytes = 1];
  ElementType     type             = 2 [(validate.rules).enum.defined_only = true];
  string          default          = 3;
  string          description      = 4;
  repeated string select_values    = 6;
  uint32          order            = 7;
  // textarea_language 多行（ElementTypeTextArea）编辑器语言提示，空值由前端回退默认（env）。
  // 透传给 CodeEditor 的 language（对齐前端 FILE_TYPE_TO_LANG 键），仅对 textarea 类型有意义。
  string          textarea_language = 8;
  // group 分区名（服务卡片/折叠分区的展示元数据）。空串 = 未分组 → 前端渲染「未分组」区，
  // 全空 = 旧版扁平布局。仅前端展示用，不参与部署。
  string          group             = 9 [(validate.rules).string = {
    max_bytes: 64,
    ignore_empty: true,
  }];
}