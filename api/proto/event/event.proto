syntax = "proto3";

package event;

import "google/api/field_behavior.proto";
import "google/api/annotations.proto";
import "validate/validate.proto";
import "proto/types/types.proto";
import "openapi/v3/annotations.proto";

option go_package = "github.com/duc-cnzj/mars/api/v6/proto/event;event";

message ListRequest {
  optional int32                 page        = 1;
  optional int32                 page_size   = 2;
  // 动作类型精确过滤（单值，兼容旧客户端）：Unknown(0) = 全部
  types.EventActionType          action_type = 3;
  // 动作类型多值过滤（新参数）：空 = 全部，多值 = 任一匹配（IN）；
  // 与 action_type 同时传入时优先取 action_types
  repeated types.EventActionType action_types = 5;
  // 模糊搜索 message 和 username
  string                         search      = 4;
  // all：管理员显式 opt-in 查看全部用户事件（默认收敛到本人，最小权限）；普通用户传此字段等效无操作
  bool                           all         = 6;
}

message ListResponse {
  int32                     page      = 1;
  int32                     page_size = 2;
  repeated types.EventModel items     = 3;
}

message ShowRequest {
  int32 id = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
}

message ShowResponse {
  types.EventModel item = 1;
}

service Event {
  rpc List(ListRequest) returns (ListResponse) {
    option (google.api.http)                                               = {
      get: "/api/events"
    };
    option (openapi.v3.operation) = {
      summary: "用户操作事件列表",
    };
  }

  rpc Show(ShowRequest) returns (ShowResponse) {
    option (google.api.http)                                               = {
      get: "/api/events/{id}"
    };

    option (openapi.v3.operation) = {
      summary: "查看事件详情, 包含 old, new",
    };
  }
}