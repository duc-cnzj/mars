syntax = "proto3";

package git;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "validate/validate.proto";
import "openapi/v3/annotations.proto";

option go_package = "github.com/duc-cnzj/mars/api/v6/proto/git;git";

message Option {
  string value          = 1;
  string label          = 2;
  string type           = 3;
  bool   is_leaf        = 4;
  int32  git_project_id = 5;
  string branch         = 6;
  bool   need_git_repo  = 7;
  string description    = 8;
}

message ProjectOptionsRequest {}
message ProjectOptionsResponse {
  repeated Option items = 1;
}

message BranchOptionsRequest {
  int32 git_project_id = 1 [(validate.rules).int32.gt = 0];

  // 如果传入 repo_id, 就会根据 mars 配置过滤分支
  int32 repo_id        = 2;
}

message BranchOptionsResponse {
  repeated Option items = 1;
}

message CommitOptionsRequest {
  int32  git_project_id = 1 [(validate.rules).int32.gt = 0];
  string branch         = 2;
}

message CommitOptionsResponse {
  repeated Option items = 1;
}

message CommitRequest {
  int32  git_project_id = 1 [(validate.rules).int32.gt = 0];
  string branch         = 2 [(validate.rules).string.min_bytes = 1];
  string commit         = 3 [(validate.rules).string.min_bytes = 1];
}

message CommitResponse {
  string id              = 1;
  string short_id        = 2;
  int32  git_project_id  = 3;

  string label           = 4;
  string title           = 5;
  string branch          = 6;
  string author_name     = 7;
  string author_email    = 8;
  string committer_name  = 9;
  string committer_email = 10;
  string web_url         = 11;
  string message         = 12;

  string committed_date  = 13;
  string created_at      = 14;
}

message PipelineInfoRequest {
  string git_project_id = 1 [(validate.rules).string.min_bytes = 1];
  string branch         = 2 [(validate.rules).string.min_bytes = 1];
  string commit         = 3 [(validate.rules).string.min_bytes = 1];
}

// PipelineInfoByRepoIdRequest 按 mars 部署仓库（repo_id）查询某提交的流水线状态。
// 与 PipelineInfoRequest 的区别：主语是 repo 而非 git 项目——流水线状态判定
// 会应用该 repo 配置的 pass 规则（见 service Git 的 PipelineInfoByRepoId）。
message PipelineInfoByRepoIdRequest {
  int32  repo_id = 1 [(validate.rules).int32.gt = 0];
  string branch  = 2 [(validate.rules).string.min_bytes = 1];
  string commit  = 3 [(validate.rules).string.min_bytes = 1];
}

// PipelineJob 是 CI 流水线单个 job 的名称、状态与所属 stage。
message PipelineJob {
  string name       = 1;
  // status 是 job 的状态，取值同 PipelineInfoResponse.status。
  string status     = 2;
  string stage_name = 3;
}

message PipelineInfoResponse {
  // status 是流水线判定结果，可能取值：
  //   success - 流水线通过；
  //   failed  - 流水线失败；
  //   running - 流水线执行中；
  //   manual  - 存在手动触发的 job，等待人工确认；
  //   unknown - 状态未知（created/pending/canceled/skipped/scheduled 等未识别状态）。
  // 仓库配置 pipeline pass 规则时由规则判定：配置的 (stage, job) 全部成功后判定 success，
  // 规则指定的 job 缺失时回退为整体流水线状态；未配置规则时为 CI 整体流水线状态。
  string status  = 1;
  string web_url = 2;
  // jobs 是流水线各 job 的名称与状态，按执行顺序排列。
  repeated PipelineJob jobs = 3;
}

// PipelineJobOptionsRequest 请求某项目流水线的 stage/job 下拉选项。
message PipelineJobOptionsRequest {
  // git_project_id 必填，> 0。
  int32 git_project_id = 1 [(validate.rules).int32.gt = 0];
  // branch 可选：指定分支时取该分支最近 pipeline；为空时取项目最近 pipeline。
  string branch         = 2;
}

// PipelineJobOptionsResponse 是配置通过规则用的 stage/job 下拉选项（各自去重）。
message PipelineJobOptionsResponse {
  // stages 是 pipeline 的全部 stage 名（按出现顺序去重）。
  repeated string stages = 1;
  // jobs 是 pipeline 的全部 job 名（按执行顺序去重）。
  repeated string jobs   = 2;
}

message AllReposRequest{}
message AllReposResponse{
  message Item {
    int32  id          = 1;
    string name        = 2;
    string description = 3;
  }

  repeated Item items = 1;
}

service Git {
  rpc AllRepos(AllReposRequest) returns(AllReposResponse) {
    option (google.api.http)      = {
      get: "/api/git/all_repos",
    };
    option (openapi.v3.operation) = {
      summary: "获取所有 git 仓库列表",
    };
  }

  rpc ProjectOptions(ProjectOptionsRequest) returns (ProjectOptionsResponse) {
    option (google.api.http)      = {
      get: "/api/git/project_options",
    };
    option (openapi.v3.operation) = {
      summary: "获取项目信息， 用在级联列表",
    };
  }

  rpc BranchOptions(BranchOptionsRequest) returns (BranchOptionsResponse) {
    option (google.api.http)      = {
      get: "/api/git/projects/{git_project_id}/branch_options",
    };
    option (openapi.v3.operation) = {
      summary: "获取分支信息， 用在级联列表",
    };
  }

  rpc CommitOptions(CommitOptionsRequest) returns (CommitOptionsResponse) {
    option (google.api.http)      = {
      get: "/api/git/projects/{git_project_id}/branches/{branch}/commit_options",
    };
    option (openapi.v3.operation) = {
      summary: "获取commit信息， 用在级联列表",
    };
  }

  rpc Commit(CommitRequest) returns (CommitResponse) {
    option (google.api.http)      = {
      get: "/api/git/projects/{git_project_id}/branches/{branch}/commits/{commit}",
    };
    option (openapi.v3.operation) = {
      summary: "获取 commit 详情",
    };
  }

  rpc PipelineInfo(PipelineInfoRequest) returns (PipelineInfoResponse) {
    option (google.api.http)      = {
      get: "/api/git/projects/{git_project_id}/branches/{branch}/commits/{commit}/pipeline_info",
    };
    option (openapi.v3.operation) = {
      summary: "获取 pipeline 详情",
    };
  }

  // PipelineInfoByRepoId 按 repo 获取流水线详情：仓库配置 pass 规则时，
  // status 由规则判定，否则为 CI 整体流水线状态（与 PipelineInfo 同响应）。
  rpc PipelineInfoByRepoId(PipelineInfoByRepoIdRequest) returns (PipelineInfoResponse) {
    option (google.api.http)      = {
      get: "/api/git/repos/{repo_id}/branches/{branch}/commits/{commit}/pipeline_info",
    };
    option (openapi.v3.operation) = {
      summary: "按 repo 获取 pipeline 详情（status 按 repo 配置的通过规则判定）",
    };
  }

  rpc PipelineJobOptions(PipelineJobOptionsRequest) returns (PipelineJobOptionsResponse) {
    option (google.api.http)      = {
      get: "/api/git/projects/{git_project_id}/pipeline_job_options",
    };
    option (openapi.v3.operation) = {
      summary: "获取项目流水线的 stage/job 选项，用于配置通过规则下拉",
    };
  }

  rpc GetChartValuesYaml(GetChartValuesYamlRequest) returns (GetChartValuesYamlResponse) {
    option (google.api.http)      = {
      post: "/api/git/get_chart_values_yaml",
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "获取 helm charts 的 values.yaml",
    };
  }
}
message GetChartValuesYamlRequest {
  // "pid|branch|path" or "path"
  string input = 1 [(validate.rules).string.min_bytes = 1, (google.api.field_behavior) = REQUIRED];
}
message GetChartValuesYamlResponse {
  string values = 1;
}
