syntax = "proto3";

package namespace;

import "google/api/field_behavior.proto";
import "google/api/annotations.proto";
import "proto/types/types.proto";
import "validate/validate.proto";
import "openapi/v3/annotations.proto";

option go_package = "github.com/duc-cnzj/mars/api/v6/proto/namespace;namespace";

message CreateRequest {
  string namespace        = 1 [(validate.rules).string.min_bytes = 1, (google.api.field_behavior) = REQUIRED];
  // 已存在则忽略，不会报错
  bool   ignore_if_exists = 2;
  string description      = 3;
}
message CreateResponse {
  types.NamespaceModel item   = 1;
  bool                 exists = 2;
}

message ShowRequest {
  int64 id = 1 [(validate.rules).int64.gt = 0, (google.api.field_behavior) = REQUIRED];
}
message ShowResponse {
  types.NamespaceModel item = 1;
}

message IsExistsRequest {
  string name = 1 [(validate.rules).string.min_bytes = 1, (google.api.field_behavior) = REQUIRED];
}
message IsExistsResponse {
  int64 id     = 1;
  bool  exists = 2;
}

message DeleteRequest {
  int32 id = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
}
message DeleteResponse {}

message FavoriteRequest{
  int32 id       = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
  bool  favorite = 2;
}
message FavoriteResponse{}

message UpdateDescRequest{
  int32  id   = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
  string desc = 2;
}
message UpdateDescResponse{
  types.NamespaceModel item = 1;
}

message ListRequest {
  optional int32  page      = 1;
  optional int32  page_size = 2;
  bool            favorite  = 3;
  optional string name      = 4;
}
message ListResponse {
  repeated types.NamespaceModel items     = 1;
  int32                         count     = 2;
  int32                         page      = 3;
  int32                         page_size = 4;
}

message UpdatePrivateRequest{
  int32 id      = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
  bool  private = 2;
}
message UpdatePrivateResponse{
  types.NamespaceModel item = 1;
}

message SyncMembersRequest{
  int32           id     = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
  repeated string emails = 2 [(validate.rules).repeated.items.string.email = true];
}
message SyncMembersResponse{
  types.NamespaceModel item = 1;
}

// UpdateConfigRequest 一次性原子更新命名空间配置（描述/私有/成员/转让管理员）。
// 各字段 optional：不传（或为空）则不更新对应项；传入则生效。仅空间管理员/超级管理员可调用。
message UpdateConfigRequest{
  int32 id = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
  // 描述；不传不更新
  optional string desc = 2;
  // 是否私有；不传不更新（optional 区分"未传"与 false）
  optional bool private = 3;
  // 成员邮箱列表；不传不更新，传入则全量同步（多余删除、缺失新增）
  repeated string emails = 4 [(validate.rules).repeated.items.string.email = true];
  // 新管理员邮箱；空串不转让（ignore_empty 保证不传时跳过 email 校验）
  string new_admin_email = 5 [(validate.rules).string = {email: true, ignore_empty: true}];
}
message UpdateConfigResponse{
  types.NamespaceModel item = 1;
}

// AdminListRequest 命名空间管理列表（管理员后台）。
message AdminListRequest {
  optional int32 page      = 1;
  optional int32 page_size = 2;
  // 关键词：匹配空间名/创建者邮箱
  string search = 3;
  // 只看私有空间
  bool private_only = 4;
  // 活跃度分类过滤：active/dormant/zombie，空 = 全部
  string liveness = 5;
}
// AdminItem 命名空间管理条目：空间模型（含成员/创建者）+ 实时用量 + 最近活跃时间。
message AdminItem {
  types.NamespaceModel ns       = 1;
  // CPU 用量（人类可读，如 "2.1 core"）
  string cpu_used = 2;
  // 内存用量（人类可读，如 "18.4 GiB"）
  string mem_used = 3;
  // 最近活跃时间：空间下所有项目 UpdatedAt 的最大值（RFC3339）；无项目（从未活跃）为空串
  string last_active_at = 4;
  // 活跃度分类：active（活跃）/ dormant（低活跃）/ zombie（僵尸）；无项目（从未活跃）视为 zombie
  string liveness_kind = 5;
}
// LivenessStats 活跃度统计（基于 search 命中全量，不随分页/分类过滤裁剪）。
message LivenessStats {
  int32 total = 1;
  int32 active = 2;
  int32 dormant = 3;
  int32 zombie = 4;
}
message AdminListResponse {
  int32 page      = 1;
  int32 page_size = 2;
  int32 count     = 3;
  repeated AdminItem items = 4;
  // 活跃度统计（基于 search 命中全量）
  LivenessStats stats = 5;
}

service Namespace {
  rpc List(ListRequest) returns (ListResponse) {
    option (google.api.http)      = {
      get: "/api/namespaces"
    };
    option (openapi.v3.operation) = {
      summary: "分页获取名称空间",
    };
  }

  rpc UpdatePrivate(UpdatePrivateRequest) returns (UpdatePrivateResponse) {
    option (google.api.http)      = {
      post: "/api/namespaces/update_private",
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "修改空间的访问权限",
    };
  }

  rpc SyncMembers(SyncMembersRequest) returns (SyncMembersResponse) {
    option (google.api.http)      = {
      post: "/api/namespaces/sync_members",
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "修改空间的成员",
    };
  }

  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse) {
    option (google.api.http)      = {
      post: "/api/namespaces/update_config",
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "批量更新空间配置（描述/私有/成员/转让管理员）",
    };
  }

  rpc Create(CreateRequest) returns (CreateResponse) {
    option (google.api.http)      = {
      post: "/api/namespaces",
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "创建名称空间",
    };
  }

  rpc Show(ShowRequest) returns (ShowResponse) {
    option (google.api.http)      = {
      get: "/api/namespaces/{id}"
    };
    option (openapi.v3.operation) = {
      summary: "查看名称空间详情",
    };
  }

  rpc UpdateDesc(UpdateDescRequest) returns (UpdateDescResponse) {
    option (google.api.http)      = {
      post: "/api/namespaces/{id}/update_desc",
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "更新空间描述信息",
    };
  }

  rpc Delete(DeleteRequest) returns (DeleteResponse) {
    option (google.api.http)      = {
      delete: "/api/namespaces/{id}"
    };
    option (openapi.v3.operation) = {
      summary: "删除名称空间",
    };
  }

  rpc IsExists(IsExistsRequest) returns (IsExistsResponse) {
    option (google.api.http)      = {
      post: "/api/namespaces/exists"
    };
    option (openapi.v3.operation) = {
      summary: "IsExists 名称空间是否存在",
    };
  }

  rpc Favorite(FavoriteRequest) returns (FavoriteResponse) {
    option (google.api.http)      = {
      post: "/api/namespaces/favorite",
      body: "*"
    };

    option (openapi.v3.operation) = {
      summary: "关注/取消关注",
    };
  }

  rpc FavoriteSort(FavoriteSortRequest) returns (FavoriteSortResponse) {
    option (google.api.http)      = {
      put: "/api/namespaces/favorite/sort",
      body: "*"
    };

    option (openapi.v3.operation) = {
      summary: "移动关注列表中一个空间到另一个位置",
    };
  }

  rpc Transfer(TransferRequest) returns (TransferResponse){
    option (google.api.http)      = {
      post: "/api/namespaces/transfer",
      body: "*"
    };

    option (openapi.v3.operation) = {
      summary: "转让自己的空间给别人",
    };
  }

  // AdminList 命名空间管理列表（管理员后台）：分页 + 关键词/私有过滤 + 实时 CPU/内存用量。
  rpc AdminList(AdminListRequest) returns (AdminListResponse) {
    option (google.api.http)      = {
      get: "/api/admin/namespaces"
    };
    option (openapi.v3.operation) = {
      summary: "命名空间管理列表（管理员）",
    };
  }
}

message TransferRequest{
  int32  id              = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
  // 新管理员的邮箱
  string new_admin_email = 2 [(validate.rules).string = {min_bytes: 1, email: true}, (google.api.field_behavior) = REQUIRED];
}
message TransferResponse{
  types.NamespaceModel item = 1;
}

// FavoriteSortRequest 把关注列表中的 first_id 移动到 second_id 所在位置，中间元素整体顺移。
// 前端拖拽只需提交被移动与落点两个空间 id，无需全量重排。
message FavoriteSortRequest{
  // 被移动的空间 id
  int32 first_id = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
  // 移动目标位置的参照空间 id
  int32 second_id = 2 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
}
message FavoriteSortResponse{}