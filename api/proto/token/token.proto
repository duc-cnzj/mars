syntax = "proto3";

package token;

import "google/api/annotations.proto";
import "validate/validate.proto";
import "proto/types/types.proto";

option go_package = "github.com/duc-cnzj/mars/api/v6/proto/token;token";

message ListRequest {
  optional int32  page      = 1;
  optional int32  page_size = 2;
  string          search    = 3; // 按创建人邮箱模糊搜索（管理员后台按用户查令牌）
  // all：管理员显式 opt-in 查看全部用户令牌（默认收敛到本人，最小权限）；普通用户传此字段等效无操作
  bool all = 4;
  // status：令牌状态过滤（''/缺省=不过滤；valid=有效、expired=已过期、revoked=已撤销）。
  // 状态判定以撤销优先（与展示层标签一致：已撤销 > 已过期 > 有效）。
  string status = 5;
}

message ListResponse {
  int32                           page      = 1;
  int32                           page_size = 2;
  repeated types.AccessTokenModel items     = 3;
  int32                           count     = 4;
}

message GrantRequest {
  int32  expire_seconds = 1 [(validate.rules).int32.gt = 0];
  string usage          = 2 [(validate.rules).string.max_len = 30];
}

message GrantResponse {
  types.AccessTokenModel token = 1;
}

message LeaseRequest {
  string token          = 1 [(validate.rules).string.min_bytes = 1];
  int32  expire_seconds = 2 [(validate.rules).int32.gt = 0];
}

message LeaseResponse {
  types.AccessTokenModel token = 1;
}

message RevokeRequest {
  string token = 1 [(validate.rules).string.min_bytes = 1];
}

message RevokeResponse {}

service AccessToken {
  rpc List(ListRequest) returns (ListResponse) {
    option (google.api.http) = {
      get: "/api/access_tokens"
    };
  }

  rpc Grant(GrantRequest) returns (GrantResponse) {
    option (google.api.http) = {
      post: "/api/access_tokens",
      body: "*"
    };
  }

  rpc Lease(LeaseRequest) returns (LeaseResponse) {
    option (google.api.http) = {
      put: "/api/access_tokens/{token}",
      body: "*"
    };
  }

  rpc Revoke(RevokeRequest) returns (RevokeResponse) {
    option (google.api.http) = {
      delete: "/api/access_tokens/{token}"
    };
  }
}
