syntax = "proto3";

package repo;

import "openapi/v3/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/annotations.proto";
import "validate/validate.proto";
import "proto/types/types.proto";
import "proto/mars/mars.proto";

option go_package = "github.com/duc-cnzj/mars/api/v6/proto/repo;repo";

message ListRequest {
  optional int32 page      = 1;
  optional int32 page_size = 2;
  optional bool  enabled   = 3;
  string         name      = 4;
}

message ListResponse {
  int32                    page      = 1;
  int32                    page_size = 2;
  int32                    count     = 3;
  repeated types.RepoModel items     = 4;
}

message ShowRequest {
  int32 id = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
}

message ShowResponse {
  types.RepoModel item = 1;
}
message ToggleEnabledRequest{
  int32 id      = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
  bool  enabled = 2 [(google.api.field_behavior) = REQUIRED];
}
message ToggleEnabledResponse{
  types.RepoModel item = 1;
}

message CreateRequest{
  string         name           = 1 [(validate.rules).string = {min_bytes: 1, pattern: "^[a-zA-Z0-9_-]+$"}, (google.api.field_behavior) = REQUIRED];
  optional int32 git_project_id = 2;
  mars.Config    mars_config    = 3;
  bool           need_git_repo  = 4;
  string         description    = 5;
}
message CreateResponse{
  types.RepoModel item = 1;
}
message UpdateRequest{
  int32          id             = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
  string         name           = 2 [(validate.rules).string = {min_bytes: 1, pattern: "^[a-zA-Z0-9_-]+$"}, (google.api.field_behavior) = REQUIRED];
  optional int32 git_project_id = 3;
  mars.Config    mars_config    = 4;
  bool           need_git_repo  = 5;
  string         description    = 6;
}
message UpdateResponse{
  types.RepoModel item = 1;
}

message AllRequest {
  optional bool enabled = 1;
}
message AllResponse{
  repeated types.RepoModel items = 1;
}

service Repo {
  rpc List(ListRequest) returns (ListResponse) {
    option (google.api.http)      = {
      get: "/api/repos"
    };
    option (openapi.v3.operation) = {
      summary: "获取 repo 列表",
    };
  }

  rpc Create(CreateRequest) returns (CreateResponse) {
    option (google.api.http)      = {
      post: "/api/repos",
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "创建 repo",
    };
  }

  rpc Show(ShowRequest) returns (ShowResponse) {
    option (google.api.http)      = {
      get: "/api/repos/{id}"
    };
    option (openapi.v3.operation) = {
      summary: "获取 repo 详情",
    };
  }

  // 注意：Export 必须排在 Show 之后。grpc-gateway 按注册逆序试匹配路由，
  // Show 的 `/api/repos/{id}` 通配会吞掉 `/api/repos/export`，Export 晚注册才能先命中。
  rpc Export(ExportRequest) returns (ExportResponse) {
    option (google.api.http)      = {
      get: "/api/repos/export"
    };
    option (openapi.v3.operation) = {
      summary: "导出全部 repo 为 JSON（与导入格式一致，可直接回导入）",
    };
  }

  // ExportOne 路由 /api/repos/{id}/export 为 3 段，与 Export 的 /api/repos/export、
  // Show 的 /api/repos/{id}（均 2 段）段数不同，无 grpc-gateway 路由遮蔽，注册顺序无关。
  rpc ExportOne(ExportOneRequest) returns (ExportResponse) {
    option (google.api.http)      = {
      get: "/api/repos/{id}/export"
    };
    option (openapi.v3.operation) = {
      summary: "导出单个 repo 为 JSON（与导入格式一致，可直接回导入）",
    };
  }

  rpc Import(ImportRequest) returns (ImportResponse) {
    option (google.api.http)      = {
      post: "/api/repos/import"
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "导入 repo JSON（按名称幂等：已存在则覆盖，不存在则创建）",
    };
  }

  rpc Update(UpdateRequest) returns (UpdateResponse) {
    option (google.api.http)      = {
      put: "/api/repos/{id}",
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "更新 repo",
    };
  }

  rpc Delete(DeleteRequest) returns (DeleteResponse) {
    option (google.api.http)      = {
      delete: "/api/repos/{id}",
    };
    option (openapi.v3.operation) = {
      summary: "删除 repo",
    };
  }

  rpc ToggleEnabled(ToggleEnabledRequest) returns (ToggleEnabledResponse) {
    option (google.api.http)      = {
      post: "/api/repos/toggle_enabled"
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "开启/关闭 repo",
    };
  }

  rpc Clone(CloneRequest) returns (CloneResponse) {
    option (google.api.http)      = {
      post: "/api/repos/clone"
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "克隆 repo",
    };
  }
}

message DeleteRequest{
  int32  id   = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
}
message DeleteResponse{}

message CloneRequest{
  int32  id   = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
  string name = 2 [(validate.rules).string = {min_bytes: 1, pattern: "^[a-zA-Z0-9_-]+$"}, (google.api.field_behavior) = REQUIRED];
}

message CloneResponse{
  types.RepoModel item = 1;
}

message ExportRequest{}

message ExportOneRequest {
  int32 id = 1 [(validate.rules).int32.gt = 0, (google.api.field_behavior) = REQUIRED];
}

message ExportResponse {
  repeated types.RepoModel items = 1;
}

message ImportRequest {
  // items 与导出响应同构：导出的 JSON 文件内容可原样作为导入请求体。
  repeated types.RepoModel items = 1;
  // dry_run 为 true 时只预览计数（将新建/覆盖多少），不落库、不留审计、不产生快照。
  bool dry_run = 2;
}

message ImportResponse {
  int32 total   = 1;
  int32 created = 2;
  int32 updated = 3;
  // updated_old 仅 dry_run 预览时返回：将被覆盖条目的当前（旧）状态，
  // 供前端按 name 与导入文件条目配对渲染 old→new diff；真实导入时为空。
  repeated types.RepoModel updated_old = 4;
}